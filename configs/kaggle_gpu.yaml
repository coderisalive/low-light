# Kaggle GPU (T4 / P100) Configuration for SNR-Guided Internal Reference Transfer
experiment_name: "snr_reference_stable_v3"
seed: 42

model_type: "snr_internal_reference"

model:
  base_channels: 24
  feature_channels: 32
  num_blocks: 4
  patch_size: 12
  top_k: 3
  min_ref_reliability: 0.40
  similarity_threshold: 0.25
  use_reference_transfer: true
  act_type: "leaky_relu"

training:
  batch_size: 16
  crop_size: 192
  learning_rate: 0.0002
  weight_decay: 0.0001
  epochs: 35
  scheduler_gamma: 0.5
  scheduler_patience: 3
  min_learning_rate: 0.000001
  lr_min_delta: 0.01
  validation_fraction: 0.10
  resume_override_lr: true
  device: "cuda" # 'cuda' or 'auto'
  use_amp: true # Automatic Mixed Precision for 2-3x GPU speedup
  num_workers: 2
  pin_memory: true
  save_interval: 5
  eval_interval: 1
  log_interval: 5
  early_stopping_patience: 8
  early_stopping_min_delta: 0.01

loss:
  w_pseudo: 1.0
  w_gradient: 1.2
  # This feature-alignment loss pulls fused features toward target features
  # and can counteract reference transfer. Disabled for this experiment.
  w_reference: 0.0
  w_exposure: 2.0
  w_color: 1.0
  w_smooth: 5.0
  w_consistency: 0.05
  pseudo_min_luminance: 0.10
  pseudo_min_reliability: 0.25
  min_attenuation: 0.12
  max_attenuation: 0.35
  noise_std_min: 0.01
  noise_std_max: 0.04
  exp_patch_size: 16
  target_exposure: 0.45
  smooth_k: 10.0
  color_patch_size: 16

data:
  # Self-supervised training uses only our485/low.
  # A deterministic held-out subset of our485 low/high pairs is used for
  # validation metrics; eval15 is reserved for final evaluation.
  train_dir: "data/lol_dataset/our485/low"
  train_high_dir: "data/lol_dataset/our485/high"
  test_low_dir: "data/lol_dataset/eval15/low"
  test_high_dir: "data/lol_dataset/eval15/high"
