# Fast Smoke Test Configuration for local verification
experiment_name: "smoke_test"
seed: 42

model:
  base_channels: 16
  feature_channels: 24
  num_blocks: 3
  use_dw_conv: true
  use_reliability_map: true
  use_reliability_gate: true
  use_noise_estimation: true
  use_separate_color: true
  act_type: "leaky_relu"

training:
  batch_size: 2
  crop_size: 128
  learning_rate: 0.0005
  weight_decay: 0.0001
  epochs: 3
  scheduler_gamma: 0.5
  scheduler_step_size: 5
  device: "cpu"
  save_interval: 1
  eval_interval: 1
  log_interval: 1
  early_stopping_patience: 3

loss:
  w_mask: 0.5
  w_exp: 8.0
  w_smooth: 15.0
  w_color: 3.0
  w_struct: 0.1
  w_identity: 0.05
  mask_ratio: 0.15
  mask_mode: "neighbor_mean"
  exp_patch_size: 16
  target_exposure: 0.55
  smooth_k: 10.0
  color_patch_size: 16

data:
  train_dir: "data/synthetic_sample/train/low"
  val_low_dir: "data/synthetic_sample/val/low"
  val_high_dir: "data/synthetic_sample/val/high"
