# SNR-Guided Internal Reference Transfer Training on LOL-v1
experiment_name: "snr_reference_lol_v1"
seed: 42

model_type: "snr_internal_reference"

model:
  base_channels: 24
  feature_channels: 32
  num_blocks: 4
  patch_size: 16
  top_k: 3
  min_ref_reliability: 0.40
  similarity_threshold: 0.25
  use_reference_transfer: true
  act_type: "leaky_relu"

training:
  batch_size: 4
  crop_size: 128
  learning_rate: 0.0004
  weight_decay: 0.0001
  epochs: 5
  scheduler_gamma: 0.5
  scheduler_step_size: 2
  device: "cpu"
  save_interval: 1
  eval_interval: 1
  log_interval: 10
  early_stopping_patience: 5

loss:
  w_pseudo: 1.0
  w_gradient: 0.5
  w_reference: 0.1
  w_exposure: 4.0
  w_color: 2.0
  w_smooth: 10.0
  w_consistency: 0.0
  min_attenuation: 0.12
  max_attenuation: 0.35
  noise_std_min: 0.01
  noise_std_max: 0.04
  exp_patch_size: 16
  target_exposure: 0.50
  smooth_k: 10.0
  color_patch_size: 16

data:
  train_dir: "data/lol_dataset/our485/low"
  val_low_dir: "data/lol_dataset/eval15/low"
  val_high_dir: "data/lol_dataset/eval15/high"
  test_low_dir: "data/lol_dataset/eval15/low"
  test_high_dir: "data/lol_dataset/eval15/high"
