# Fast Smoke Test Configuration for SNR-Guided Internal Reference Transfer
experiment_name: "snr_reference_smoke"
seed: 42

model_type: "snr_internal_reference" # 'snr_internal_reference' or 'lumaguard'

model:
  base_channels: 16
  feature_channels: 24
  num_blocks: 3
  patch_size: 16
  top_k: 2
  min_ref_reliability: 0.35
  similarity_threshold: 0.20
  use_reference_transfer: true
  act_type: "leaky_relu"

training:
  batch_size: 2
  crop_size: 128
  learning_rate: 0.0005
  weight_decay: 0.0001
  epochs: 3
  scheduler_gamma: 0.5
  scheduler_step_size: 5
  device: "cpu"
  save_interval: 1
  eval_interval: 1
  log_interval: 1
  early_stopping_patience: 3

loss:
  w_pseudo: 1.0
  w_gradient: 0.5
  w_reference: 0.1
  w_exposure: 4.0
  w_color: 2.0
  w_smooth: 10.0
  w_consistency: 0.2
  min_attenuation: 0.15
  max_attenuation: 0.35
  noise_std_min: 0.01
  noise_std_max: 0.03
  exp_patch_size: 16
  target_exposure: 0.50
  smooth_k: 10.0
  color_patch_size: 16

data:
  train_dir: "data/synthetic_sample/train/low"
  val_low_dir: "data/synthetic_sample/val/low"
  val_high_dir: "data/synthetic_sample/val/high"
